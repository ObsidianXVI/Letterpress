<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Letterpress — a handcrafted blog about coding, design and software engineering.">

  <style>
    /*
      Horizontal overscroll is how browsers trigger back/forward navigation from
      a two-finger swipe. Articles contain horizontally scrolling regions (code
      blocks, card carousels), so reaching the end of one and continuing to
      swipe would otherwise navigate away from the page mid-read. `none` also
      suppresses the rubber-band effect, which the app draws over anyway.
    */
    html, body {
      overscroll-behavior-x: none;
      margin: 0;
      padding: 0;
    }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="letterpress">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Letterpress</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    flutter_bootstrap.js is generated at build time and knows the engine
    revision, the renderer and the entrypoint path, so it can start fetching the
    engine without waiting for a second script to parse first.

    It replaces the older flutter.js + `_flutter.loader.loadEntrypoint` pair,
    which is deprecated and warned on every build, and which deferred the whole
    download until the window `load` event — i.e. until every other subresource
    had already finished.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
